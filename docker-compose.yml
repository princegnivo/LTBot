services:
  ltbot:
    build: .
    container_name: ltbot
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data          # comptes, jetons, SSID, journaux : à sauvegarder
    restart: unless-stopped   # redémarre après une panne ou un redémarrage du serveur
    init: true                # arrêt propre des navigateurs Playwright
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
